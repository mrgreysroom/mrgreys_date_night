<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#070609"><link rel="manifest" href="/manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Moje hry · Mr Grey's Date Night</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 5%,rgba(177,55,241,.2),transparent 25%),linear-gradient(#050507,#09070b 65%,#050507);color:#f8f5fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;min-height:100vh}
.wrap{max-width:560px;margin:auto;padding:26px 18px 60px}.brand{text-align:center}.brand img{width:118px;height:118px;object-fit:contain;mix-blend-mode:screen}.brandline{font-size:10px;letter-spacing:.27em;color:#d8d1db}
h1{font-size:39px;line-height:1.02;text-align:center;margin:18px 0 9px}.sub{text-align:center;color:#aaa1ae;line-height:1.5;margin:0 auto 22px}
.panel{border:1px solid rgba(255,255,255,.09);border-radius:26px;padding:22px;background:linear-gradient(145deg,#121016,#09080b);margin-top:18px}
label{font-size:13px;font-weight:850}input{width:100%;min-height:58px;margin-top:9px;border-radius:16px;border:1.5px solid rgba(194,75,245,.45);background:#151219;color:#fff;padding:0 16px;font-size:17px;outline:none}input:focus{border-color:#ca53f8;box-shadow:0 0 0 3px rgba(187,66,244,.13)}button,.btn{width:100%;min-height:56px;border:0;border-radius:16px;margin-top:11px;background:linear-gradient(135deg,#8425c9,#c44cf3);color:#fff;font-weight:900;font-size:15px;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center}.secondary{background:#18161c;border:1px solid rgba(255,255,255,.09)}.msg{font-size:12px;line-height:1.45;color:#aaa1ae;margin:12px 2px 0;text-align:center}
.games{display:grid;gap:11px;margin-top:15px}.offlineBox{margin-top:15px;border:1px solid rgba(211,82,255,.22);border-radius:18px;padding:15px;background:rgba(134,37,201,.08)}.offlineTitle{font-size:13px;font-weight:900}.offlineText{font-size:12px;line-height:1.45;color:#aaa1ae;margin-top:6px}.offlineOk{color:#9be3b7}.offlineWarn{color:#e8c889}.game{border:1px solid rgba(255,255,255,.09);border-radius:19px;padding:16px;background:#111015;display:flex;align-items:center;justify-content:space-between;gap:14px}.game strong{font-size:16px}.status{font-size:11px;font-weight:900;border-radius:999px;padding:7px 9px}.open{background:rgba(112,214,151,.12);color:#9be3b7;border:1px solid rgba(112,214,151,.22)}.locked{background:rgba(255,255,255,.04);color:#837c87;border:1px solid rgba(255,255,255,.06)}.hidden{display:none!important}.logout{font-size:12px;color:#aaa1ae;text-align:center;margin-top:18px;cursor:pointer;text-decoration:underline}
</style>
<script src="/pricing.js"></script><script src="/i18n-core.js"></script></head>
<body><div class="wrap">
<div class="brand"><img src="assets/mrgreys-x.jpg" alt="Mr Grey's Room"><div class="brandline">MR GREY'S ROOM</div></div>
<h1>Moje hry</h1>
<p class="sub">Otvorte si zakúpené hry. Prihlásite sa odkazom z e-mailu.</p>

<section id="login" class="panel">
<form id="magicForm">
<label for="email">E-mail použitý pri nákupe</label>
<input id="email" type="email" placeholder="meno@email.sk" autocomplete="email" required>
<button id="sendBtn" type="submit">POSLAŤ PRIHLASOVACÍ ODKAZ</button>
<div id="loginMsg" class="msg">Po kliknutí na odkaz v e-maile sa vrátite sem a zobrazia sa vaše hry.</div>
</form>
</section>

<section id="library" class="panel hidden">
<div class="games" id="games" aria-live="polite"></div>
<details id="offlineBox" class="offlineBox hidden"><summary class="offlineTitle">Hranie bez internetu</summary><div id="offlineText" class="offlineText">Offline hranie je voliteľné. Ak ho chcete používať, pripravte si hru ešte počas pripojenia na internet.</div><button id="offlineBtn" type="button">PRIPRAVIŤ HRU OFFLINE</button></details>

<div class="logout" id="logout">Odhlásiť sa</div>
</section>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/+esm";
const supabase=createClient("https://siferzggaubvtjlqdckj.supabase.co","sb_publishable_5V6HZj-kn5B9CVFWrGDR8g_xEWKdJwu",{auth:{detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);
const OFFLINE_KEY="mrg_offline_access_v1";
const OFFLINE_DAYS=30;
const ALL_PRODUCTS=["romantic","secrets","dare","afterdark","complete"];
let renderVersion=0;

function saveOfflineAccess(user, rows){
  const products=[...new Set((rows||[]).map(x=>x.product_code).filter(Boolean))];
  if(products.includes("complete")) ALL_PRODUCTS.forEach(x=>products.includes(x)||products.push(x));
  const now=Date.now();
  localStorage.setItem(OFFLINE_KEY,JSON.stringify({version:1,userId:user.id,email:user.email||"",products,verifiedAt:now,expiresAt:now+OFFLINE_DAYS*86400000}));
}
function readOfflineAccess(){try{const x=JSON.parse(localStorage.getItem(OFFLINE_KEY)||"null");return x&&x.expiresAt>Date.now()?x:null}catch(e){return null}}
async function registerOfflineWorker(){
  if(!('serviceWorker' in navigator)) return null;
  try{return await navigator.serviceWorker.register('/service-worker.js',{scope:'/'});}catch(e){return null}
}
async function prepareOffline(showStatus=true){
  const text=$("offlineText"),btn=$("offlineBtn");
  if(!navigator.onLine){if(showStatus){text.textContent="Na prípravu offline režimu sa teraz pripojte na internet.";text.className="offlineText offlineWarn";}return false}
  const reg=await registerOfflineWorker();
  if(!reg){if(showStatus){text.textContent="Tento prehliadač nepodporuje spoľahlivý offline režim.";text.className="offlineText offlineWarn";}return false}
  try{await navigator.serviceWorker.ready;}catch(e){}
  const worker=reg.active||reg.waiting||reg.installing;
  if(!worker){if(showStatus){text.textContent="Offline režim sa nepodarilo pripraviť. Skúste znova.";text.className="offlineText offlineWarn";}return false}
  if(showStatus){btn.disabled=true;btn.textContent="PRIPRAVUJEM…";text.textContent="Ukladám hru do tohto zariadenia…";}
  return await new Promise(resolve=>{
    let done=false;const finish=ok=>{if(done)return;done=true;clearTimeout(timer);navigator.serviceWorker.removeEventListener('message',onMsg);if(showStatus){btn.disabled=false;btn.textContent="OBNOVIŤ OFFLINE HRU";text.textContent=ok?`Hotovo. Zakúpené hry sú pripravené offline na ${OFFLINE_DAYS} dní od posledného online overenia.`:"Niektoré súbory sa nepodarilo uložiť. Skúste prípravu zopakovať.";text.className="offlineText "+(ok?"offlineOk":"offlineWarn");}resolve(ok)};
    const onMsg=e=>{if(e.data&&e.data.type==='CACHE_GAME_RESULT')finish(!!e.data.ok)};
    navigator.serviceWorker.addEventListener('message',onMsg);
    const timer=setTimeout(()=>finish(false),15000);
    worker.postMessage({type:'CACHE_GAME'});
  });
}
function refreshOfflineStatus(){
  const cached=readOfflineAccess(),text=$("offlineText"),btn=$("offlineBtn");
  if(!cached){text.textContent="Najprv online overíme vaše zakúpené hry a potom ich uložíme do zariadenia.";text.className="offlineText";btn.textContent="PRIPRAVIŤ HRU OFFLINE";return}
  const until=new Date(cached.expiresAt).toLocaleDateString(({sk:'sk-SK',cz:'cs-CZ',pl:'pl-PL',en:'en-GB'})[window.MRG_LANGUAGE]||'sk-SK');
  text.textContent=`Prístup je uložený v tomto zariadení. Offline overenie platí do ${until}; pri každom online otvorení sa automaticky obnoví.`;text.className="offlineText offlineOk";btn.textContent="OBNOVIŤ OFFLINE HRU";
}
const products=[
  ["romantic","🖤 ROMANTIC"],["secrets","🔐 SECRETS"],["dare","😈 DARE"],["afterdark","🌙 AFTER DARK"],["complete","✕ X COMPLETE"]
];

async function render(){
  const version=++renderVersion;
  const games=$("games"), offline=$("offlineBox");
  const {data:{session}}=await supabase.auth.getSession();
  if(version!==renderVersion) return;
  const user=session?.user;
  $("login").classList.toggle("hidden",Boolean(user));
  $("library").classList.toggle("hidden",!user);
  offline.classList.add("hidden");
  if(!user) return;
  games.textContent="Načítavam zakúpené hry…";
  try {
    const response=await fetch("/api/my-games",{headers:{Authorization:"Bearer "+session.access_token},cache:"no-store"});
    if(version!==renderVersion) return;
    if(response.status===401){
      $("login").classList.remove("hidden");
      $("library").classList.add("hidden");
      $("loginMsg").textContent="Prihlásenie vypršalo. Vyžiadajte si nový odkaz.";
      return;
    }
    if(!response.ok) throw new Error("Game lookup failed");
    const {games:rows}=await response.json();
    if(version!==renderVersion) return;
    const owned=new Set(rows.map(row=>row.product_code));
    const visible=products.filter(([code])=>owned.has("complete") ? code==="complete" : owned.has(code));
    if(!visible.length){
      games.textContent="Pod týmto e-mailom zatiaľ neevidujeme zakúpenú hru. Skontrolujte e-mail použitý pri nákupe.";
      return;
    }
    const lang=encodeURIComponent(window.MRG_LANGUAGE||"sk");
    games.innerHTML=visible.map(([code,name])=>
      `<a class="btn" href="/play?pack=${code}&lang=${lang}">Spustiť ${name}</a>`
    ).join("");
    try {saveOfflineAccess(user,rows);} catch {}
    offline.classList.remove("hidden");
    refreshOfflineStatus();
  }catch{
    if(version!==renderVersion) return;
    games.innerHTML='<div class="msg">Zakúpené hry sa nepodarilo načítať.</div><button id="retryGames" class="secondary" type="button">Skúsiť znova</button>';
    $("retryGames").addEventListener("click",()=>render());
  }
}

let resendTimer=null;
let loginRequestPending=false;
function startCooldown(seconds=60){
  const btn=$("sendBtn"), note=$("loginMsg");
  let left=seconds;
  btn.disabled=true;
  btn.textContent="E-MAIL ODOSLANÝ ✓";
  note.className="msg ok";
  note.innerHTML=`<strong>Hotovo.</strong> Prihlasovací odkaz sme poslali na váš e-mail.<br>Použite prosím najnovší prijatý e-mail. Ďalší odkaz môžete poslať o ${left} s.`;
  clearInterval(resendTimer);
  resendTimer=setInterval(()=>{
    left--;
    if(left<=0){
      clearInterval(resendTimer);
      btn.disabled=false;
      btn.textContent="POSLAŤ PRIHLASOVACÍ ODKAZ";
      note.innerHTML="Ak e-mail neprišiel, môžete ho poslať znova. Skontrolujte aj Spam alebo Reklamy.";
    }else{
      note.innerHTML=`<strong>Hotovo.</strong> Prihlasovací odkaz sme poslali na váš e-mail.<br>Použite prosím najnovší prijatý e-mail. Ďalší odkaz môžete poslať o ${left} s.`;
    }
  },1000);
}

$("magicForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const btn=$("sendBtn"), msg=$("loginMsg");
  if(loginRequestPending || btn.disabled) return;
  const email=$("email").value.trim().toLowerCase();
  msg.className="msg"; msg.textContent="";
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    msg.className="msg err";
    msg.textContent="Zadajte prosím platnú e-mailovú adresu.";
    return;
  }
  loginRequestPending=true;
  btn.disabled=true; btn.textContent="ODOSIELAM…";
  let error;
  try {
    ({error}=await supabase.auth.signInWithOtp({
      email,
      options:{emailRedirectTo:location.origin+"/account.html?lang="+encodeURIComponent(window.MRG_LANGUAGE||"sk")}
    }));
  } catch (requestError) {
    error=requestError;
  } finally {
    loginRequestPending=false;
  }
  if(error){
    btn.disabled=false; btn.textContent="POSLAŤ PRIHLASOVACÍ ODKAZ";
    msg.className="msg err";
    const rateLimited = error.status === 429 || /rate|limit|too many/i.test(error.message || "");
    msg.textContent = rateLimited
      ? "Prihlasovací odkaz ste si vyžiadali príliš rýchlo za sebou. Počkajte prosím aspoň 60 sekúnd a skúste to znova."
      : "Prihlasovací odkaz sa nepodarilo odoslať. Skúste to prosím znova o chvíľu.";
    return;
  }
  startCooldown(60);
});

$("offlineBtn").addEventListener("click",()=>prepareOffline(true));
$("logout").addEventListener("click",async()=>{localStorage.removeItem(OFFLINE_KEY);await supabase.auth.signOut();render();});
// The fragment is kept out of HTTP requests and removed before verification.
const authFragment=new URLSearchParams(location.hash.slice(1));
const purchaseToken=authFragment.get("token_hash");
if(purchaseToken){
  history.replaceState(history.state,"",location.pathname+location.search);
  $("sendBtn").disabled=true;
  $("loginMsg").textContent="Prihlasujem vás do Moje hry…";
  try {
    const {error}=await supabase.auth.verifyOtp({type:"email",token_hash:purchaseToken});
    if(error) throw error;
  } catch {
    $("loginMsg").textContent="Tento odkaz už neplatí. Ak nie ste prihlásení, vyžiadajte si nový.";
  } finally {
    $("sendBtn").disabled=false;
  }
} else if(authFragment.has("error_code") || new URLSearchParams(location.search).has("error_code")){
  $("loginMsg").textContent="Tento prihlasovací odkaz už neplatí. Vyžiadajte si nový.";
}
let authRenderTimer=null;
supabase.auth.onAuthStateChange(()=>{
  clearTimeout(authRenderTimer);
  authRenderTimer=setTimeout(()=>{
    render();
  },0);
});
await registerOfflineWorker();
</script></body></html>
