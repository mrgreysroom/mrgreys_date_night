<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nákup úspešný</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 12%,rgba(174,54,239,.22),transparent 30%),#060608;color:#f8f5fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;display:grid;place-items:center;padding:22px}.box{width:min(100%,560px);text-align:center;border:1px solid rgba(255,255,255,.1);border-radius:29px;padding:34px 25px;background:#0e0c11}.x{font-size:68px;color:#ba48f3}.box h1{font-size:34px;margin:10px 0}.box p{color:#aaa1ae;line-height:1.5}.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;margin-top:14px;min-height:56px;border-radius:15px;background:linear-gradient(135deg,#8425c9,#c44cf3);color:white;font-weight:900}.small{font-size:12px;color:#8f8793;margin-top:12px}</style><script src="/i18n-core.js"></script></head>
<body><div class="box"><div class="x">✕</div><h1 id="title">Overujeme platbu…</h1><p id="text">Chvíľku počkajte. Vašu hru zapisujeme k e-mailu použitému pri nákupe.</p><div id="actions"></div></div>
<script>
(async()=>{const id=new URLSearchParams(location.search).get("session_id");const t=document.getElementById("title"),p=document.getElementById("text"),a=document.getElementById("actions");
try{const r=await fetch("/api/confirm-purchase?session_id="+encodeURIComponent(id||""));const d=await r.json();if(!r.ok)throw new Error();t.textContent="Platba prebehla úspešne.";p.textContent="Hra je uložená k vášmu e-mailu a zostáva vám natrvalo. Otvorte Moje hry a pošleme vám bezpečný Magic Link.";a.innerHTML='<a class="btn" href="/account.html">OTVORIŤ MOJE HRY</a><div class="small">Pri ďalšej návšteve stačí opäť použiť rovnaký e-mail.</div>';}catch(e){t.textContent="Platba bola prijatá.";p.textContent="Platbu sme prijali, ale automatické potvrdenie prístupu sa nepodarilo dokončiť. Skúste stránku o chvíľu obnoviť; ak sa hra v Moje hry nezobrazí, kontaktujte podporu.";a.innerHTML='<a class="btn" href="/account.html">MOJE HRY</a>';}})();
</script></body></html>
